<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connect TikTok · But How Do It Know?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .code { font: 700 1rem/1.4 ui-monospace, monospace; word-break: break-all; background: rgba(10, 15, 38, .7);
          border: 2px solid var(--cyan); border-radius: 10px; padding: 1rem; margin: 1rem 0; }
  button { font: 700 1rem var(--body); padding: .6rem 1.2rem; border: 2px solid var(--gold); border-radius: 999px;
           background: transparent; color: var(--gold); cursor: pointer; }
  button:hover { background: var(--gold); color: var(--ink); }
</style>
</head>
<body class="doc">
<div class="sky" aria-hidden="true"><svg class="stars" id="stars"></svg></div>
<main>
  <nav><a href="index.html">Home</a></nav>
  <h1>Connect TikTok</h1>
  <!-- The code only goes to the publisher helper on the team's own computer (127.0.0.1); if that isn't running, it is shown here to copy. -->
  <div id="ok" hidden>
    <p>TikTok approved the connection. Copy this one-time code into Cyrex Publisher. It expires in a few minutes.</p>
    <div class="code" id="code"></div>
    <button type="button" id="copy">Copy code</button>
  </div>
  <p id="err" hidden></p>
  <p id="none" hidden>This page finishes connecting a TikTok account to Cyrex Publisher. Start the connection from Cyrex Publisher.</p>
</main>
<script src="stars.js"></script>
<script>
  var q = new URLSearchParams(location.search);
  function showCode() {
    document.getElementById('ok').hidden = false;
    document.getElementById('code').textContent = q.get('code');
    document.getElementById('copy').onclick = function () {
      navigator.clipboard.writeText(q.get('code')).then(function () { document.getElementById('copy').textContent = 'Copied'; });
    };
  }
  if (q.get('code')) {
    var expected = sessionStorage.getItem('tt_state');
    if (expected && expected !== q.get('state')) {
      var e = document.getElementById('err');
      e.hidden = false;
      e.textContent = 'This sign-in did not start from Cyrex Publisher, so it was ignored. Start again from the publisher page.';
    } else {
      fetch('http://127.0.0.1:8765/exchange', {targetAddressSpace: 'loopback', method: 'POST', headers: {'Content-Type': 'application/json'},
                                              body: JSON.stringify({code: q.get('code')})})
        .then(function (r) { return r.json(); })
        .then(function (r) {
          if (r.error) throw new Error(r.error);
          sessionStorage.removeItem('tt_state');
          location.replace('publisher.html');
        })
        .catch(showCode);
    }
  } else if (q.get('error')) {
    var e = document.getElementById('err');
    e.hidden = false;
    e.textContent = 'TikTok did not connect: ' + (q.get('error_description') || q.get('error')) + '. Start the connection again from Cyrex Publisher.';
  } else {
    document.getElementById('none').hidden = false;
  }
</script>
</body>
</html>
